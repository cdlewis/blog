baseURL = 'https://blog.chrislewis.au'
languageCode = 'en-au'
title = "Chris' Blog"
theme = 'hugo-bearblog'

disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[params]
hideMadeWithLine = true
mainSections = ['blog']
title = "Chris' Blog"
description = "Various ramblings"



[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
